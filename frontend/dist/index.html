<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrackOps</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>TrackOps</h1>
        <p>Music library tools</p>
      </header>
      <nav aria-label="Tools">
        <button type="button" id="sanitize-mp3">ID3 Sanitizer</button>
        <button type="button" id="open-playlist">Format Playlist</button>
      </nav>
      <section aria-labelledby="sanitize-heading">
        <h2 id="sanitize-heading">ID3 Sanitizer</h2>
        <p id="sanitize-status" role="status" aria-live="polite">Choose MP3 files to remove the (Original Mix) title suffix.</p>
        <button type="button" id="stop-sanitize" hidden>Stop</button>
        <ul id="sanitize-errors"></ul>
      </section>
      <section aria-labelledby="playlist-heading">
        <h2 id="playlist-heading">Playlist titles</h2>
        <p id="playlist-status" role="status" aria-live="polite">Choose a playlist to see its titles.</p>
        <button type="button" id="copy-titles" disabled>Copy titles</button>
        <button type="button" id="save-titles" hidden>Save titles</button>
        <p id="save-status" role="status" aria-live="polite"></p>
        <div id="replace-choice" hidden>
          <p>Replace existing output?</p>
          <button type="button" id="replace-titles">Replace</button>
          <button type="button" id="cancel-replace">Cancel</button>
        </div>
        <ol id="titles"></ol>
      </section>
    </main>
  </body>
</html>
